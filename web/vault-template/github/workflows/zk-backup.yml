# Nightly backup of this Slip-box vault. Installed by the Slip-box app.
# Creates a verified .zip (notes + attachments + settings) as a private GitHub Release,
# keeps 7 daily, 4 weekly and 12 monthly backups, and removes trashed notes older than 30 days.
name: Backup
on:
  schedule:
    - cron: "__CRON__" # 02:00 in __TZ__
  workflow_dispatch:
    inputs:
      reason:
        description: Why this backup is running
        default: manual
permissions:
  contents: write
concurrency:
  group: zk-backup
  cancel-in-progress: false
env:
  TZ: "__TZ__"
  ZK_KEEP_DAILY: "7"
  ZK_KEEP_WEEKLY: "4"
  ZK_KEEP_MONTHLY: "12"
jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Empty old items from the trash
        run: |
          node .zk/tools/backup.mjs purge-trash
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "Slip-box backup"
            git config user.email "backup@users.noreply.github.com"
            git add -A && git commit -qm "Empty trash (older than 30 days)" && git push -q
          fi
      - name: Create and verify archive
        id: archive
        run: node .zk/tools/backup.mjs archive "$RUNNER_TEMP/backups"
      - name: Store archive as a release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.archive.outputs.name }}" \
            "${{ steps.archive.outputs.zip }}" "${{ steps.archive.outputs.manifest }}" \
            --title "Backup ${{ steps.archive.outputs.name }}" \
            --notes-file "${{ steps.archive.outputs.notes_file }}" --latest=false
      - name: Remove old backups
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .zk/tools/backup.mjs prune
      # Optional off-site copy to an S3-compatible bucket (AWS S3, Backblaze B2, Cloudflare R2, MinIO).
      # Add these repository secrets to turn it on: ZK_S3_BUCKET, ZK_S3_ACCESS_KEY_ID, ZK_S3_SECRET_ACCESS_KEY,
      # and optionally ZK_S3_ENDPOINT (for non-AWS providers) and ZK_BACKUP_PASSPHRASE (encrypts the copy).
      - name: Off-site copy (optional)
        env:
          BUCKET: ${{ secrets.ZK_S3_BUCKET }}
          AWS_ACCESS_KEY_ID: ${{ secrets.ZK_S3_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.ZK_S3_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.ZK_S3_REGION || 'auto' }}
          ENDPOINT: ${{ secrets.ZK_S3_ENDPOINT }}
          PASSPHRASE: ${{ secrets.ZK_BACKUP_PASSPHRASE }}
        if: env.BUCKET != ''
        run: |
          FILE="${{ steps.archive.outputs.zip }}"
          if [ -n "$PASSPHRASE" ]; then
            openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt -in "$FILE" -out "$FILE.enc" -pass env:PASSPHRASE
            FILE="$FILE.enc"
          fi
          aws s3 cp "$FILE" "s3://$BUCKET/$(basename "$FILE")" ${ENDPOINT:+--endpoint-url "$ENDPOINT"}
